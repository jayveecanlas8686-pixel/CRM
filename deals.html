<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deals — NexusCRM</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-wrapper">
    <header class="topbar" id="topbar"></header>
    <main class="page-content">
      <div class="page-header">
        <div class="page-header-left">
          <h1 class="page-title">Deals</h1>
          <p class="page-subtitle">Manage your sales opportunities</p>
        </div>
        <div class="page-actions">
          <a href="pipeline.html" class="btn btn-outline"><i class="fas fa-columns"></i> Pipeline View</a>
          <button class="btn btn-outline" onclick="exportDeals()"><i class="fas fa-download"></i> Export</button>
          <button class="btn btn-primary" onclick="openAddDeal()"><i class="fas fa-plus"></i> Add Deal</button>
        </div>
      </div>
      <!-- Stats -->
      <div id="dealStats" class="stats-grid" style="margin-bottom:20px"></div>
      <!-- Filters -->
      <div class="filters-bar">
        <div class="search-box" style="flex:1">
          <i class="fas fa-search"></i>
          <input type="text" id="searchDeals" placeholder="Search deals..." oninput="filterDeals()">
        </div>
        <select class="filter-select" id="filterDealStage" onchange="filterDeals()">
          <option value="">All Stages</option>
          <option value="prospecting">Prospecting</option>
          <option value="qualification">Qualification</option>
          <option value="proposal">Proposal</option>
          <option value="negotiation">Negotiation</option>
          <option value="won">Won</option>
          <option value="lost">Lost</option>
        </select>
        <select class="filter-select" id="filterDealOwner" onchange="filterDeals()">
          <option value="">All Owners</option>
        </select>
      </div>
      <!-- Table -->
      <div class="card">
        <div class="card-header" style="padding:16px 20px">
          <span class="text-muted text-sm" id="dealCount">Loading...</span>
        </div>
        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>Deal Name</th>
                <th>Value</th>
                <th>Stage</th>
                <th>Probability</th>
                <th>Weighted Value</th>
                <th>Close Date</th>
                <th>Owner</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="dealTableBody">
              <tr><td colspan="8"><div class="empty-state"><div class="spinner" style="margin:0 auto"></div></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modal"></div></div>
<div class="toast-container" id="toastContainer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/deals.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    initDeals();
    // Populate owner filter
    const sel = document.getElementById('filterDealOwner');
    if (sel) {
      DB.getAll('users').filter(u=>u.role!=='viewer').forEach(u => {
        const o = document.createElement('option');
        o.value = u.id; o.textContent = u.name;
        sel.appendChild(o);
      });
    }
  });
</script>
</body>
</html>
