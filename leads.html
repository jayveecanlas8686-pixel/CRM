<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leads — NexusCRM</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-wrapper">
    <header class="topbar" id="topbar"></header>
    <main class="page-content">
      <div class="page-header">
        <div class="page-header-left">
          <h1 class="page-title">Leads</h1>
          <p class="page-subtitle">Track and convert your leads into customers</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-outline" onclick="exportLeads()"><i class="fas fa-download"></i> Export</button>
          <button class="btn btn-primary" onclick="openAddLead()"><i class="fas fa-plus"></i> Add Lead</button>
        </div>
      </div>
      <!-- Stats -->
      <div class="stats-grid" id="leadStats" style="grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:20px"></div>
      <!-- Filters -->
      <div class="filters-bar">
        <div class="search-box" style="flex:1">
          <i class="fas fa-search"></i>
          <input type="text" id="searchLeads" placeholder="Search leads..." oninput="filterLeads()">
        </div>
        <select class="filter-select" id="filterLeadStatus" onchange="filterLeads()">
          <option value="">All Statuses</option>
          <option value="new">New</option>
          <option value="contacted">Contacted</option>
          <option value="qualified">Qualified</option>
          <option value="proposal">Proposal</option>
          <option value="converted">Converted</option>
          <option value="lost">Lost</option>
        </select>
        <select class="filter-select" id="filterLeadSource" onchange="filterLeads()">
          <option value="">All Sources</option>
          <option>Website</option><option>LinkedIn</option><option>Referral</option>
          <option>Cold Call</option><option>Event</option><option>Email Campaign</option>
        </select>
      </div>
      <!-- Table -->
      <div class="card">
        <div class="card-header" style="padding:16px 20px">
          <span class="text-muted text-sm" id="leadCount">Loading...</span>
        </div>
        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>Lead</th>
                <th>Contact Info</th>
                <th>Source</th>
                <th>Status</th>
                <th>Score</th>
                <th>Owner</th>
                <th>Created</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="leadTableBody">
              <tr><td colspan="8"><div class="empty-state"><div class="spinner" style="margin:0 auto"></div></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modal"></div></div>
<div class="toast-container" id="toastContainer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/leads.js"></script>
<script>document.addEventListener('DOMContentLoaded', initLeads);</script>
</body>
</html>
